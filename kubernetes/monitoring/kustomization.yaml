apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - redis-exporter.yaml
  - postgres-exporter.yaml
  - networkpolicy.yaml
  - servicemonitors.yaml
  - rules.yaml
configMapGenerator:
  - name: poll-dashboard
    namespace: monitoring
    files:
      - poll-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: poll
