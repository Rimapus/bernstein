apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: poll-app
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: poll
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
        app.kubernetes.io/part-of: poll
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.96.0
          ports:
            - name: metrics
              containerPort: 9121
          env:
            - name: REDIS_ADDR
              value: redis://redis:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            # Length of the vote queue: votes waiting for the worker.
            - name: REDIS_EXPORTER_CHECK_SINGLE_KEYS
              value: db0=votes
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: poll-app
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: poll
spec:
  selector:
    app.kubernetes.io/name: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
