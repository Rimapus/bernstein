apiVersion: v1
kind: ResourceQuota
metadata:
  name: poll-app-quota
  namespace: poll-app
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "30"
    services: "10"
    persistentvolumeclaims: "4"
    requests.storage: 10Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: poll-app-limits
  namespace: poll-app
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
