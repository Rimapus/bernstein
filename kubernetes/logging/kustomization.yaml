apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - datasource.yaml
configMapGenerator:
  - name: poll-logs-dashboard
    namespace: monitoring
    files:
      - logs-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: poll
