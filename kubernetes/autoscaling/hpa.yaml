apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: poll
  namespace: poll-app
  labels:
    app.kubernetes.io/name: poll
    app.kubernetes.io/part-of: poll
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: poll
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: result
  namespace: poll-app
  labels:
    app.kubernetes.io/name: result
    app.kubernetes.io/part-of: poll
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: result
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
