apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: poll-app
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: poll
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: poll-app
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: poll
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
