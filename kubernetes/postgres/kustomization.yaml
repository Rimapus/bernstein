apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: poll-app
resources:
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: postgres-schema
    files:
      - schema.sql
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: poll
