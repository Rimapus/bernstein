- name: Check whether Calico is already installed
  kubernetes.core.k8s_info:
    api_version: operator.tigera.io/v1
    kind: Installation
    name: default
    kubeconfig: /etc/kubernetes/admin.conf
  register: control_plane_calico_installed

- name: Apply Calico operator CRDs and operator
  kubernetes.core.k8s:
    src: "{{ calico_manifests }}/{{ item }}"
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
  loop: [operator-crds.yaml, tigera-operator.yaml]
  when: control_plane_calico_installed.resources | length == 0

- name: Wait for Calico CRDs
  kubernetes.core.k8s:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
    state: present
    wait: true
    wait_condition:
      type: Established
      status: "True"
    wait_timeout: 120
    kubeconfig: /etc/kubernetes/admin.conf
  loop:
    - installations.operator.tigera.io
    - apiservers.operator.tigera.io
  when: control_plane_calico_installed.resources | length == 0

- name: Write Calico custom resources
  ansible.builtin.template:
    src: calico-custom-resources.yaml.j2
    dest: /etc/kubernetes/calico-custom-resources.yaml
    mode: "0600"
  register: control_plane_calico_cr

- name: Apply Calico custom resources
  kubernetes.core.k8s:
    src: /etc/kubernetes/calico-custom-resources.yaml
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
  when: control_plane_calico_cr is changed or control_plane_calico_installed.resources | length == 0

- name: Wait for Calico to be available
  ansible.builtin.command: kubectl wait --for=condition=Available --timeout=300s tigerastatus/calico
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: control_plane_calico_wait
  until: control_plane_calico_wait.rc == 0
  retries: 10
  delay: 10
  changed_when: false
