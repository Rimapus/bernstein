# SSH first so enabling ufw never locks us out.
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow registry from allowed CIDRs
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "{{ registry_port | string }}"
    proto: tcp
  loop: "{{ registry_allowed_cidrs }}"

- name: Enable firewall
  community.general.ufw:
    state: enabled
