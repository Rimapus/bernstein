---
- name: Check the installed Helm version
  ansible.builtin.command: helm version --short
  register: helm_installed
  changed_when: false
  failed_when: false

- name: Install Helm
  when: helm_installed.rc != 0 or not helm_installed.stdout.startswith(helm_version)
  block:
    - name: Download Helm
      ansible.builtin.get_url:
        url: "{{ helm_url }}"
        dest: "/tmp/helm-{{ helm_version }}.tar.gz"
        mode: "0644"
        checksum: "sha256:{{ helm_sha256 }}"

    - name: Extract the Helm binary
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        extra_opts: [--strip-components=1, linux-amd64/helm]
        owner: root
        group: root
        mode: "0755"
