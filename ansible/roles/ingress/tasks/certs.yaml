---
- name: Create the ingress certificate directory
  ansible.builtin.file:
    path: "{{ ingress_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check existing ingress certificate
  ansible.builtin.stat:
    path: "{{ ingress_cert_dir }}/tls.crt"
  register: ingress_tls_crt

- name: Read the existing ingress certificate
  community.crypto.x509_certificate_info:
    path: "{{ ingress_cert_dir }}/tls.crt"
  register: ingress_tls_info
  when: ingress_tls_crt.stat.exists

- name: Collect the certificate hosts
  ansible.builtin.set_fact:
    ingress_cert_wanted: "{{ ['*.' ~ ingress_domain] + ingress_hosts }}"
    ingress_cert_current: >-
      {{
        (ingress_tls_info.subject_alt_name | default([]))
        | map('regex_replace', '^DNS:', '')
        | list
      }}

- name: Decide whether the ingress certificate needs regeneration
  ansible.builtin.set_fact:
    ingress_cert_stale: >-
      {{
        not ingress_tls_crt.stat.exists
        or ingress_force_certs | bool
        or (ingress_cert_wanted | difference(ingress_cert_current) | length > 0)
      }}

- name: Generate CA and ingress certificate
  when: ingress_cert_stale | bool
  block:
    - name: Generate CA key
      community.crypto.openssl_privatekey:
        path: "{{ ingress_cert_dir }}/ca.key"
        type: ECC
        curve: secp256r1
        mode: "0600"
        force: "{{ ingress_force_certs | bool }}"

    - name: Generate CA CSR
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ ingress_cert_dir }}/ca.key"
        common_name: bernstein-ingress-ca
        use_common_name_for_san: false
        basic_constraints: ["CA:TRUE"]
        basic_constraints_critical: true
        key_usage: [keyCertSign, cRLSign]
        key_usage_critical: true
      register: ingress_ca_csr

    - name: Self-sign CA certificate
      community.crypto.x509_certificate:
        path: "{{ ingress_cert_dir }}/ca.crt"
        csr_content: "{{ ingress_ca_csr.csr }}"
        privatekey_path: "{{ ingress_cert_dir }}/ca.key"
        provider: selfsigned
        selfsigned_not_after: "+{{ ingress_ca_days }}d"
        mode: "0644"
        force: "{{ ingress_force_certs | bool }}"

    - name: Generate ingress key
      community.crypto.openssl_privatekey:
        path: "{{ ingress_cert_dir }}/tls.key"
        type: ECC
        curve: secp256r1
        mode: "0600"
        force: "{{ ingress_force_certs | bool }}"

    - name: Generate ingress CSR
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ ingress_cert_dir }}/tls.key"
        common_name: "*.{{ ingress_domain }}"
        subject_alt_name: "{{ ['DNS:*.' ~ ingress_domain] + ingress_hosts | map('regex_replace', '^', 'DNS:') | list }}"
        basic_constraints: ["CA:FALSE"]
        basic_constraints_critical: true
        key_usage: [digitalSignature]
        key_usage_critical: true
        extended_key_usage: [serverAuth]
      register: ingress_csr

    - name: Sign ingress certificate with the CA
      community.crypto.x509_certificate:
        path: "{{ ingress_cert_dir }}/tls.crt"
        csr_content: "{{ ingress_csr.csr }}"
        provider: ownca
        ownca_path: "{{ ingress_cert_dir }}/ca.crt"
        ownca_privatekey_path: "{{ ingress_cert_dir }}/ca.key"
        ownca_not_after: "+{{ ingress_cert_days }}d"
        mode: "0644"
        force: "{{ ingress_cert_stale | bool }}"
